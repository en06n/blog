# Dependencies
plugins:
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-email-protect
  #- jekyll-paginate
  #- jekyll-paginate-v2

# File rules
exclude:
  # default excludes
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # custom excludes
  - .gitignore
  - Makefile
  - Dangerfile
  - LICENSE
  - README.md
  - assets/
  - package.json
  - package-lock.json
  - scripts/
  - .github/
  - .nova/

include:
  - .htaccess
  # bootstrap js
  - node_modules/bootstrap/dist/js/bootstrap.min.js
  - node_modules/bootstrap/dist/js/bootstrap.min.js.map
  # bootstrap icons
  - node_modules/bootstrap-icons/font/bootstrap-icons.css
  - node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff
  - node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff2

keep_files:
  - .well-known

# Site
permalink: /posts/:year/:month/:day/:title/
excerpt_separator: <!--excerpt-->
sass:
  style: compressed

# Metadata
title: 'en06n'
url: 'https://en06n.github.io'
logo: logo.png
favicon: /favicon.ico
timezone: Asia/Tokyo

# Author
author:
  name: 'en06n'
  twitter: en06n_256
  avatar: logo.png

# Data
home_posts_limit: 5

feeds:
  limit: 30
  rss: '/feed.xml'
  json: '/feed.json'

# URLs
img_url: '/img/'
